name: Release

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            dryrun:
                description: Run release in dry-run mode
                type: boolean
                default: true
                required: true

permissions:
    contents: write
    pull-requests: write
    packages: write
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-schema

jobs:
    release:
        uses: ./.github/workflows/release-job.yml
        with:
            dryrun: ${{ inputs.dryrun || false }}
        secrets: inherit
