name: validate-dataset

on:
    workflow_call:
        inputs:
            body:
                required: true
                type: string

permissions:
    contents: read
    pull-requests: write

jobs:
    post-comment:
        environment:
            name: ci
        name: Comment on PR
        runs-on: ubuntu-24.04
        steps:
            - name: Post comment
              uses: actions/github-script@v6
              with:
                  script: |
                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ${{inputs.body}}
                      });
