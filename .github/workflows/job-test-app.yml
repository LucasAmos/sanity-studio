on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
      name:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    name: ${{inputs.name}}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            app:
              - '${{ inputs.directory }}/**'
      - run: corepack enable
        if: ${{ steps.changes.outputs.app == 'true' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.changes.outputs.app == 'true' }}
        with:
          node-version: 24
          cache: yarn
      - run: YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
        if: ${{ steps.changes.outputs.app == 'true' }}
      - name: Test ${{ inputs.name }} app
        if: ${{ steps.changes.outputs.app == 'true' }}
        working-directory: ${{ inputs.directory }}
        run: yarn test
